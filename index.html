<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,noimageindex">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self'; frame-src 'self'; worker-src 'self'; base-uri 'none'; object-src 'none'">
  <title>비공개 링크</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #e8e4db; }
    body { color: #34312b; font-family: system-ui, -apple-system, sans-serif; }
    #gate { display: grid; min-height: 100%; min-height: 100dvh; padding: 32px; place-items: center; text-align: center; }
    #gate > div { max-width: 360px; }
    h1 { font-size: 20px; font-weight: 500; letter-spacing: -.03em; }
    p { font-size: 14px; line-height: 1.8; white-space: pre-line; }
    button { padding: 10px 18px; border: 1px solid #bcb5a8; border-radius: 4px; background: transparent; color: inherit; font: inherit; cursor: pointer; }
    #reader { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; border: 0; background: #e8e4db; }
    [hidden] { display: none !important; }
  </style>
  <script src="link.js" defer></script>
</head>
<body>
  <main id="gate" aria-live="polite">
    <div><h1 id="heading">링크를 여는 중입니다</h1><p id="status">잠시만 기다려 주세요.</p><button id="retry" type="button" hidden>다시 열기</button></div>
  </main>
  <iframe id="reader" title="콘텐츠" referrerpolicy="no-referrer" hidden></iframe>
</body>
</html>
